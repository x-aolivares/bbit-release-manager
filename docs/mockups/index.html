<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBit — Rediseño repos (mock)</title>
    <link rel="stylesheet" href="./css/app.css">
</head>

<body>

    <div class="topbar">
        <div class="topbar-brand">BBit</div>
        <div class="topbar-meta">acme-workspace · <b id="wsTotal">–</b> repositorios</div>
        <div class="topbar-meta" style="margin-left:auto;">mock del rediseño — etapa 1</div>
    </div>

    <div class="page">

        <!-- <div class="mock-note">
            Buscador universal: prefijo + blacklist (los únicos filtros). "Buscar" trae los <b id="wsTotal2">900</b> del
            workspace y aplica los filtros como vista → la tabla muestra SOLO los que coinciden.
        </div> -->

        <!-- ===================== BUSCADOR ===================== -->
        <div class="bb-panel" id="searchPanel">
            <div class="bb-section-header">Buscador de repositorios</div>
            <div class="bb-row-top">
                <div class="bb-field">
                    <label>Prefijos de proyecto</label>
                    <div class="bb-chips" id="prefixChips"></div>
                </div>
                <div class="bb-field">
                    <label>Blacklist (excluir)</label>
                    <div class="bb-chips" id="blacklistChips"></div>
                </div>
                <button class="bb-btn-primary" id="btnSearch">Buscar repositorios</button>
            </div>
            <!-- <div class="summary"><span id="wsTotal3">900</span> repositorios en el workspace → <b id="matchCount">0</b>
                con coincidencia (prefijos + blacklist)</div> -->
        </div>

        <!-- ===================== TABLA DE REPOS FILTRADOS ===================== -->
        <div class="bb-panel" id="tablePanel" style="display:none;">
            <div class="bb-section-header">Repositorios filtrados</div>
            <!-- barra de filtros de la tabla: texto (slug/nombre) + chips de tags -->
            <div class="bb-filter-bar">
                <div class="bb-field" style="max-width:320px;flex:none;">
                    <label for="tableSearch">Buscar en la lista</label>
                    <input class="bb-input" id="tableSearch" placeholder="slug o nombre…"
                        style="font-size:var(--bb-font-sm);">
                </div>
                <div class="bb-field">
                    <label>Tags de flujo</label>
                    <div class="bb-chips" id="tagFilterChips"></div>
                </div>
            </div>

            <div class="bb-row-top" style="align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--bb-font-sm);font-weight:600;padding-bottom:6px;">
                    <input type="checkbox" id="toggleBranch" style="width:15px;height:15px;accent-color:var(--bb-blue);cursor:pointer;">
                    Procesar salida
                </label>
                <input class="bb-input " id="originBranch" placeholder="Rama origen" value="release/REP-325073" style="display:none;max-width:200px;">
                <input class="bb-input " id="targetBranch" placeholder="Rama Destino" value="master" style="display:none;max-width:200px;">
                <div class="summary" id="branchSummary" style="display:none;">
                    <b id="statTotal">–</b> repos · <b style="color:var(--bb-success);" id="statFound">–</b> con la rama
                    · <b style="color:var(--bb-danger);" id="statMissing">–</b> sin la rama
                </div>
                <button class="bb-btn-secondary" id="btnBranch" style="display:none;">Ver rama en estos repos</button>
            </div>

            <!-- barra contextual: visible con 1+ seleccionados -->
            <div class="bb-selection-bar" id="selectionBar" style="display:none;">
                <input type="checkbox" id="checkAll" style="width:15px;height:15px;accent-color:#fff;cursor:pointer;"
                    title="Seleccionar/deseleccionar todo lo filtrado">
                <b id="selCount">0</b> seleccionados
                <span class="bb-selection-spacer"></span>
                <button class="bb-btn-secondary" id="btnClear" style="padding:0 10px;">Limpiar</button>
                <button class="bb-btn-primary" id="btnActions"
                    style="background:#fff;color:var(--bb-blue);border:none;">Acciones ▾</button>
            </div>

            <div class="bb-table bb-table--repos" id="reposTable" style="--bb-cols: 2.2rem 2rem 1.3fr 1.6fr 1.2fr;">
                <div class="bb-repos-head" id="reposHead">
                    <span class="bb-check-cell"><input type="checkbox" id="checkAllHead"
                            title="Seleccionar página"></span>
                    <span>#</span>
                    <span>Repositorio</span>
                    <span id="prHeadCol">Pull Request</span>
                    <span>Procesamiento</span>
                </div>
                <div id="rows"></div>
            </div>

            <div class="table-foot"
                style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                <span id="pagInfo">Mostrando 0 repositorios</span>
                <span style="display:flex;align-items:center;gap:8px;">
                    <label style="font-weight:700;color:var(--bb-text-secondary);" for="pageSize">Filas:</label>
                    <select id="pageSize" class="bb-mono" style="height:26px;">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                    <span id="pageLabel" class="bb-mono" style="min-width:52px;text-align:center;">1 / 1</span>
                    <button class="bb-btn-secondary bb-btn-sm" id="prevPage">‹ Anterior</button>
                    <button class="bb-btn-secondary bb-btn-sm" id="nextPage">Siguiente ›</button>
                </span>
            </div>
        </div>

        <!-- ===================== DETALLE DEL REPOSITORIO ===================== -->
        <div class="bb-panel" id="detailPanel" style="display:none;">
            <div class="bb-row-top">
                <button class="bb-btn-secondary bb-btn-sm" id="btnBack">‹ Volver a la lista</button>
                <div id="detailMeta"></div>
            </div>
            <div id="detailBody"></div>
        </div>

        <!-- ===================== MODAL: ACCIONES MASIVAS ===================== -->
        <div class="bb-modal-overlay" id="actionsModal" style="display:none;">
            <div class="bb-modal">
                <div class="bb-modal-head">
                    <span class="bb-modal-title">Acciones masivas</span>
                    <button class="bb-modal-x" id="modalClose" title="Cerrar">✕</button>
                </div>
                <div class="bb-modal-body">
                    <div class="muted">Repos seleccionados: <b id="modalCount" style="color:var(--bb-text);">0</b></div>
                    <div class="bb-modal-body" id="modalOptions" style="padding:0;"></div>
                </div>
            </div>
        </div>

        <!-- ===================== MODAL: CREAR PR INDIVIDUAL ===================== -->
        <div class="bb-modal-overlay" id="prModal" style="display:none;">
            <div class="bb-modal">
                <div class="bb-modal-head">
                    <span class="bb-modal-title">Crear Pull Request</span>
                    <button class="bb-modal-x" id="prModalClose" title="Cerrar">✕</button>
                </div>
                <div class="bb-modal-body">
                    <div id="prModalRepo"></div>
                    <div class="muted bb-mono" id="prModalRoute" style="margin-top:4px;font-size:12px;"></div>
                    <div style="margin-top:14px;">
                        <label class="muted" for="prTitleInput">Título del PR</label>
                        <div class="bb-row-top" style="margin-top:6px;">
                            <input class="bb-input bb-mono" id="prTitleInput" style="max-width:480px;flex:1;" value="">
                        </div>
                    </div>
                    <div class="bb-row-top" style="margin-top:16px;justify-content:flex-end;">
                        <button class="bb-btn-secondary" id="prModalCancel">Cancelar</button>
                        <button class="bb-btn-primary" id="prModalConfirm">Crear PR</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Capa fetch simulada: reemplaza un cliente HTTP real. DEBE cargar antes que data/*.js (los endpoints se registran contra BB.api). -->
    <script src="./js/api.js"></script>

    <!-- DATA = ENDPOINTS (la app real consulta estos mismos paths). -->
    <script src="./data/config.js"></script>
    <script src="./data/repositories.js"></script>
    <script src="./data/repos-quick.js"></script>
    <script src="./data/flow.js"></script>
    <script src="./data/pr.js"></script>
    <script src="./data/prs-update-titles.js"></script>
    <script src="./data/tags.js"></script>
    <script src="./data/ssm-environments.js"></script>
    <script src="./data/ssm-values.js"></script>

    <script>
        // =====================================================================
        // LÓGICA DEL MOCK (todo lo demás se edita directo en el HTML).
        // La data no se toca acá: viene de data/*.js vía BB.api.fetch().
        // =====================================================================
        window.onerror = (msg, src, line, col, err) => {
            document.title = "JS ERROR: " + msg + " L" + line;
            console.error("[MOCK ERROR]", msg, "line:", line, err);
        };
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));

        // ---------- estado ----------
        console.log("[MOCK] script inline starting, BB.config:", typeof BB.config);
        const state = {
            repos: [],
            states: {},          // slug -> pending | checking | found | not_found
            removed: new Set(),
            creating: new Set(), // PR en curso
            selected: new Set(), // slugs seleccionados (acciones masivas)
            page: 1,
            pageSize: 10,
            flowBySlug: {},      // pr + tags por repo (del flow)
            paramsBySlug: {},    // params SSM por repo
            regions: ["qa", "uat", "stgp", "prod"],
            selectedRegions: new Set(["qa", "uat", "stgp", "prod"]),
            generating: new Set(),
            excelTimer: null,
            search: "",          // texto de búsqueda en la tabla (slug/name)
            tagFilters: new Set(), // tags activos (chips)
            prefixes: [...BB.config.default_filters.project_prefixes],
            blacklist: [...BB.config.default_filters.exclude],
        };

        const api = (method, path, query) => BB.api.fetch(method, path, query);

        // ---------- utilidades de listado ----------
        function visibleRepos() {
            return state.repos.filter(r => !state.removed.has(r.slug))
                .slice().sort((a, b) => a.slug.localeCompare(b.slug));
        }

        // Filtros de la tabla (vista sobre lo ya filtrado): texto (slug/name) + tags.
        function filteredRepos() {
            const q = state.search.trim().toLowerCase();
            return visibleRepos().filter(r => {
                if (q && !r.slug.toLowerCase().includes(q) && !(r.name || "").toLowerCase().includes(q)) {
                    return false;
                }
                if (state.tagFilters.size && !(r.tags || []).some(t => state.tagFilters.has(t))) {
                    return false;
                }
                return true;
            });
        }

        function paginatedRepos() {
            const all = filteredRepos();
            const pages = Math.max(1, Math.ceil(all.length / state.pageSize));
            if (state.page > pages) state.page = pages;
            return { rows: all.slice((state.page - 1) * state.pageSize, state.page * state.pageSize), pages, total: all.length };
        }

        // Chips de tags disponibles + estado activo.
        function renderTagChips() {
            const allTags = new Set();
            visibleRepos().forEach(r => (r.tags || []).forEach(t => allTags.add(t)));
            $("tagFilterChips").innerHTML = [...allTags].sort().map(t =>
                `<button class="bb-filter-chip ${state.tagFilters.has(t) ? "bb-filter-chip--active" : ""}" data-tag-filter="${esc(t)}">${esc(t)}</button>`
            ).join("");
        }

        // ---------- rendereo de la tabla ----------
        function prCell(repo) {
            const creating = state.creating.has(repo.slug);
            const pr = state.flowBySlug[repo.slug]?.pr;
            if (creating) {
                return '<span class="bb-deploy-badge bb-deploy--pending"><span class="bb-spinner-inline"></span>Creando PR…</span>';
            }
            // La columna PR solo aplica con "Procesar salida" y recién tiene
            // sentido cuando la rama se verificó ("Ver rama en estos repos").
            // Antes de eso el estado es pending/checking → no se muestra PR.
            if (state.states[repo.slug] !== "found") {
                return '<span class="muted">—</span>';
            }
            if (pr && pr.url) {
                return `<a class="bb-link" href="${esc(pr.url)}" target="_blank">${esc(pr.title)}</a>`;
            }
            const origin = $("originBranch").value.trim();
            const dest = $("targetBranch").value.trim() || "master";
            const apiHint = `/api/pr?repo=${repo.slug}&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}&title=${encodeURIComponent(`Release: ${origin} → ${dest}`)}`;
            return `<button class="bb-link" data-action="create-pr" data-slug="${repo.slug}" title="POST ${apiHint}">Crear PR</button>`;
        }

        function branchBadge(repo) {
            const st = state.states[repo.slug];
            if (st === "checking") return '<span class="bb-deploy-badge bb-deploy--pending"><span class="bb-spinner-inline"></span>Revisando…</span>';
            // not_found se remueve de la lista; lo que queda ya tiene la rama (implícito).
            return "";
        }

        // La columna "Pull Request" es exclusiva de "Procesar salida": sin el
        // checkbox no existe (ni header ni celdas), y el grid pasa a 4 columnas.
        function syncPrColumn() {
            const active = $("toggleBranch").checked;
            $("prHeadCol").style.display = active ? "" : "none";
            $("reposTable").style.setProperty("--bb-cols",
                active ? "2.2rem 2rem 1.3fr 1.6fr 1.2fr" : "2.2rem 2rem 1.3fr 1.2fr");
        }

        function renderRows() {
            const { rows, total } = paginatedRepos();
            const pad = Math.max(1, String(total).length);
            const offset = (state.page - 1) * state.pageSize;
            const prActive = $("toggleBranch").checked;
            syncPrColumn();
            $("rows").innerHTML = rows.map((repo, i) => `
                <div class="bb-repos-row ${state.selected.has(repo.slug) ? "bb-repos-row--selected" : ""}">
                    <span class="bb-check-cell">
                        <input type="checkbox" class="row-check" data-slug="${esc(repo.slug)}"
                            ${state.selected.has(repo.slug) ? "checked" : ""}>
                    </span>
                    <span class="bb-mono muted" style="font-size:12px;">${String(offset + i + 1).padStart(pad, "0")}</span>
                    <span>
                        <a class="bb-link" href="#" data-action="open-detail" data-slug="${esc(repo.slug)}">${esc(repo.slug)}</a>
                        ${state.states[repo.slug] === "checking"
                    ? `<div class="muted" style="margin-top:4px;">${branchBadge(repo)}</div>` : ""}
                    </span>
                    <span style="display:${prActive ? "" : "none"}">${prCell(repo)}</span>
                    <span>
                        <button class="bb-btn-secondary bb-btn-sm" data-action="open-detail" data-slug="${esc(repo.slug)}">Ver más ›</button>
                    </span>
                </div>`).join("");
            renderSelection();
        }

        // ---------- selección masiva ----------
        function visibleSlugs() {
            return filteredRepos().map(r => r.slug);
        }

        function renderSelection() {
            const all = visibleSlugs();
            const pageSlugs = paginatedRepos().rows.map(r => r.slug);
            const n = state.selected.size;
            $("selectionBar").style.display = n > 0 ? "flex" : "none";
            $("selCount").textContent = n;
            $("checkAll").checked = n > 0 && all.length > 0 && all.every(s => state.selected.has(s));
            $("checkAllHead").checked = pageSlugs.length > 0 && pageSlugs.every(s => state.selected.has(s));
        }

        function renderCounts() {
            const all = filteredRepos();
            const found = all.filter(r => state.states[r.slug] === "found").length;
            const pages = Math.max(1, Math.ceil(all.length / state.pageSize));
            if (state.page > pages) state.page = pages;
            const from = all.length ? (state.page - 1) * state.pageSize + 1 : 0;
            const to = Math.min(state.page * state.pageSize, all.length);
            const filtrado = state.search || state.tagFilters.size ? ` (filtrado sobre ${visibleRepos().length})` : "";
            $("pagInfo").textContent = `Mostrando ${from}–${to} de ${all.length} repositorios${filtrado} · ${state.removed.size} removidos por no tener la rama`;
            $("pageLabel").textContent = `${state.page} / ${pages}`;
            $("prevPage").disabled = state.page <= 1;
            $("nextPage").disabled = state.page >= pages;
        }

        // ---------- acciones: listado ----------
        $("btnSearch").addEventListener("click", async () => {
            const res = await api("GET", "/api/repos-quick", {
                origin: $("originBranch").value.trim(),
                destination: $("targetBranch").value.trim(),
                project_prefixes: state.prefixes.join(",") || BB.config.default_filters.project_prefixes.join(","),
                exclude: state.blacklist.join(","),
            });
            const flow = await api("GET", "/api/flow", { origin: "release/REP-325073", destination: "master", with_diff: true, with_tags: true });
            state.repos = res.repos;
            state.flowBySlug = {};
            for (const r of flow.repos) state.flowBySlug[r.slug] = r;
            // PR cacheado que devuelve repos-quick (tabla `repositories`, TTL 24h):
            // se muestra ya existente en la primera consulta, sin ir a Bitbucket.
            for (const r of res.repos) {
                if (r.pr) {
                    if (!state.flowBySlug[r.slug]) state.flowBySlug[r.slug] = { slug: r.slug, pr: null, tags: {} };
                    state.flowBySlug[r.slug].pr = r.pr;
                }
            }
            state.states = {};
            state.removed.clear();
            res.repos.forEach(r => { state.states[r.slug] = "pending"; });
            state.search = "";
            state.tagFilters.clear();
            $("tableSearch").value = "";
            renderTagChips();
            $("tablePanel").style.display = "flex";
            $("branchSummary").style.display = "none";
            $("btnBranch").disabled = false;
            $("btnBranch").textContent = "Ver rama en estos repos";
            renderRows();
            renderCounts();
            window.scrollTo({ top: $("tablePanel").offsetTop - 20, behavior: "smooth" });
        });

        $("toggleBranch").addEventListener("change", (ev) => {
            const vis = ev.target.checked ? "inline-block" : "none";
            $("originBranch").style.display = vis;
            $("targetBranch").style.display = vis;
            $("btnBranch").style.display = vis;
            $("branchSummary").style.display = "none";
            syncPrColumn();
            renderRows();
            if (!ev.target.checked) {
                state.removed.clear();
                state.repos.forEach(r => { state.states[r.slug] = "pending"; });
                $("statTotal").textContent = "–";
                $("statFound").textContent = "–";
                $("statMissing").textContent = "–";
                renderCounts(); renderTagChips();
                $("btnBranch").disabled = false;
                $("btnBranch").textContent = "Ver rama en estos repos";
            }
        });

        $("btnBranch").addEventListener("click", () => {
            if ($("btnBranch").disabled) return;
            $("btnBranch").disabled = true;
            state.removed.clear();
            $("branchSummary").style.display = "inline-block";
            state.repos.forEach(r => { state.states[r.slug] = "checking"; });
            const updateStats = () => {
                const total = state.repos.length;
                const found = state.repos.filter(r => state.states[r.slug] === "found").length;
                $("statTotal").textContent = total;
                $("statFound").textContent = found;
                $("statMissing").textContent = total - found;
            };
            updateStats();
            renderRows(); renderCounts(); renderTagChips();

            state.repos.forEach((repo, i) => {
                setTimeout(() => {
                    const found = repo.branch_state === "found";
                    state.states[repo.slug] = found ? "found" : "not_found";
                    if (!found) {
                        state.removed.add(repo.slug);
                        state.selected.delete(repo.slug);
                    }
                    updateStats();
                    renderRows(); renderCounts(); renderTagChips();
                    if (state.repos.every(r => state.states[r.slug] !== "checking")) {
                        $("btnBranch").disabled = false;
                        $("btnBranch").textContent = "Reconsultar rama";
                    }
                }, 300 + i * 120);
            });
        });

        async function createPr(slug, title) {
            if (state.creating.has(slug)) return;
            state.creating.add(slug);
            renderRows();
            const origin = $("originBranch").value.trim();
            const dest = $("targetBranch").value.trim() || "master";
            const res = await api("POST", "/api/pr", {
                repo: slug, origin, destination: dest,
                title: title || `Release: ${origin} → ${dest}`,
            });
            if (!state.flowBySlug[slug]) state.flowBySlug[slug] = { slug, pr: null, tags: {} };
            state.flowBySlug[slug].pr = res.pr;
            state.creating.delete(slug);
            renderRows();
            const repo = state.repos.find(r => r.slug === slug);
            if (repo) repo.pr = res.pr;
            if (state.detailSlug === slug) renderDetail();
        }

        // ---------- modal: crear PR individual ----------
        let prModalSlug = null;
        function openPrModal(slug) {
            const origin = $("originBranch").value.trim();
            const dest = $("targetBranch").value.trim() || "master";
            prModalSlug = slug;
            $("prModalRepo").innerHTML = `<b>${esc(slug)}</b>`;
            $("prModalRoute").textContent = `POST /api/pr?repo=${slug}&origin=${origin}&destination=${dest}`;
            $("prTitleInput").value = `Release: ${origin} → ${dest}`;
            $("prModal").style.display = "flex";
        }
        function closePrModal() {
            $("prModal").style.display = "none";
            prModalSlug = null;
        }
        $("prModalClose").addEventListener("click", closePrModal);
        $("prModalCancel").addEventListener("click", closePrModal);
        $("prModalConfirm").addEventListener("click", () => {
            const slug = prModalSlug;
            if (!slug) return;
            const title = $("prTitleInput").value.trim();
            closePrModal();
            createPr(slug, title);
        });

        $("pageSize").addEventListener("change", (e) => {
            state.pageSize = Number(e.target.value);
            state.page = 1;
            renderRows(); renderCounts();
        });

        // ---------- filtros de la tabla ----------
        // Al filtrar por texto o tags, la selección se limita a lo que queda
        // visible: los repos fuera del filtro se des-seleccionan solos.
        function pruneSelection() {
            const visible = new Set(visibleSlugs());
            for (const s of [...state.selected]) {
                if (!visible.has(s)) state.selected.delete(s);
            }
            renderSelection();
        }

        $("tableSearch").addEventListener("input", (e) => {
            state.search = e.target.value;
            state.page = 1;
            pruneSelection();
            renderRows(); renderCounts();
        });

        $("tagFilterChips").addEventListener("click", (ev) => {
            const chip = ev.target.closest("[data-tag-filter]");
            if (!chip) return;
            const t = chip.dataset.tagFilter;
            if (state.tagFilters.has(t)) state.tagFilters.delete(t);
            else state.tagFilters.add(t);
            state.page = 1;
            pruneSelection();
            renderTagChips();
            renderRows(); renderCounts();
        });
        $("prevPage").addEventListener("click", () => {
            if (state.page <= 1) return;
            state.page--;
            renderRows(); renderCounts();
        });
        $("nextPage").addEventListener("click", () => {
            state.page++;
            renderRows(); renderCounts();
        });

        $("rows").addEventListener("click", (ev) => {
            const el = ev.target.closest("[data-action]");
            if (!el) return;
            if (el.dataset.action === "create-pr") openPrModal(el.dataset.slug);
            if (el.dataset.action === "open-detail") openDetail(el.dataset.slug);
        });

        // ---------- selección masiva: eventos ----------
        function toggleSlug(slug, on) {
            if (on) state.selected.add(slug);
            else state.selected.delete(slug);
            renderRows();
        }

        $("rows").addEventListener("change", (ev) => {
            const cb = ev.target.closest(".row-check");
            if (!cb) return;
            toggleSlug(cb.dataset.slug, cb.checked);
        });

        $("checkAllHead").addEventListener("change", (ev) => {
            const pageSlugs = paginatedRepos().rows.map(r => r.slug);
            if (ev.target.checked) pageSlugs.forEach(s => state.selected.add(s));
            else pageSlugs.forEach(s => state.selected.delete(s));
            renderRows();
        });

        $("checkAll").addEventListener("change", (ev) => {
            const slugs = visibleSlugs();
            if (ev.target.checked) {
                // select-all opera sobre lo visible actual (filtro aplicado):
                // reemplaza la selección, no suma a la anterior.
                state.selected = new Set(slugs);
            } else {
                slugs.forEach(s => state.selected.delete(s));
            }
            $("checkAllHead").checked = ev.target.checked;
            renderRows();
        });

        $("btnClear").addEventListener("click", () => {
            state.selected.clear();
            renderRows();
        });

        // ---------- modal de acciones masivas ----------
        function openActionsModal() {
            const sel = [...state.selected];
            const repos = sel.map(s => state.repos.find(r => r.slug === s)).filter(Boolean);
            $("modalCount").textContent = repos.length;
            const readyPr = repos.filter(r => state.states[r.slug] === "found").length;
            const withFlow = repos.filter(r => (r.tags || []).length > 0).length;

            const opt = (title, desc, count, hint, action) => `
                <div class="bb-modal-option" data-action="${action}">
                    <div>
                        <div class="bb-option-title">${title}</div>
                        <div class="bb-option-desc">${desc}${hint ? ` — <b>${hint}</b>` : ""}</div>
                    </div>
                    <div class="bb-option-count">${count}</div>
                </div>`;

            $("modalOptions").innerHTML =
                opt("Crear PRs", "Para los repos con rama resuelta, PR de la rama origen → destino.",
                    `${readyPr}/${repos.length} aptos`,
                    readyPr >= repos.length ? "" : `${repos.length - readyPr} sin rama resuelta`, "mass-pr") +
                opt("Crear tags Circle (deploy)", "Genera el tag de deploy (uat/stgp) para los repos seleccionados.",
                    `${readyPr}/${repos.length} aptos`, "", "mass-tags-deploy") +
                opt("Crear tag de repo (flujo)", "Etiqueta repos con su flujo: fargate, step-function, workflow, batch.",
                    `${withFlow}/${repos.length} con tags`, "", "mass-tag-flow") +
                '<div class="muted" style="padding:2px 4px;">SSM (params por región) — más adelante.</div>';

            $("actionsModal").style.display = "flex";
        }

        function closeActionsModal() {
            $("actionsModal").style.display = "none";
        }
        $("btnActions").addEventListener("click", openActionsModal);
        $("modalClose").addEventListener("click", closeActionsModal);
        $("actionsModal").addEventListener("click", (ev) => {
            if (ev.target === $("actionsModal")) closeActionsModal();
        });

        $("modalOptions").addEventListener("click", async (ev) => {
            const opt = ev.target.closest("[data-action]");
            if (!opt) return;
            const slugs = [...state.selected];
            const origin = $("originBranch").value.trim();
            const dest = $("targetBranch").value.trim() || "master";

            if (opt.dataset.action === "mass-tag-flow") {
                // Sub-paso: tags existentes + input para crear nuevo.
                // Sigue el lenguaje del buscador: header + field con label + chips.
                const existingTags = new Set();
                slugs.forEach(s => {
                    const r = state.repos.find(x => x.slug === s);
                    (r?.tags || []).forEach(t => existingTags.add(t));
                });
                const allTags = [...existingTags].sort();
                const makeCheck = (t, checked) => `
                    <div class="bb-tag-chip" data-tag="${esc(t)}">
                        <input type="checkbox" data-tag-check="${esc(t)}" ${checked ? "checked" : ""}>
                        ${esc(t)}
                    </div>`;
                $("modalOptions").innerHTML =
                    '<div class="bb-section-header">Crear tag de repo (flujo)</div>' +
                    '<div class="bb-row-top">' +
                    '<div class="bb-field">' +
                    '<label>Tags de flujo</label>' +
                    '<div class="bb-chips" id="tagFlowChips">' +
                    (allTags.length
                        ? allTags.map(t => {
                            const allHave = slugs.every(s => (state.repos.find(x => x.slug === s)?.tags || []).includes(t));
                            return makeCheck(t, allHave);
                        }).join("")
                        : '<span class="muted">Ningún repo tiene tags de flujo aún.</span>') +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="bb-row-top">' +
                    '<div class="bb-field" style="flex:none;">' +
                    '<label for="newTagInput">Nuevo tag</label>' +
                    '<div class="bb-row-top" style="gap:6px;">' +
                    '<input class="bb-input" id="newTagInput" placeholder="ej: lambdas" style="max-width:200px;font-size:12px;">' +
                    '<button class="bb-btn-secondary" data-action="add-new-tag" style="font-size:12px;padding:4px 10px;">+ Agregar</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div id="newTagError" style="color:var(--bb-danger);font-size:12px;"></div>' +
                    '<div class="bb-row-top" style="gap:8px;">' +
                    '<button class="bb-btn-primary" data-action="apply-tags">Aplicar</button>' +
                    '<button class="bb-btn-danger" data-action="clear-tags">Limpiar tags</button>' +
                    '<button class="bb-btn-secondary" data-action="back-tags">‹ Volver</button>' +
                    '</div>';
                return;
            }

            if (opt.dataset.action === "add-new-tag") {
                const input = $("newTagInput");
                const val = (input?.value || "").trim().toLowerCase();
                const err = $("newTagError");
                if (!val) { if (err) err.textContent = "Ingresá un nombre."; return; }
                if (val.length < 2) { if (err) err.textContent = "Muy corto (mín. 2 chars)."; return; }
                if (!/^[a-z0-9][a-z0-9_-]*$/.test(val)) { if (err) err.textContent = "Solo minúsculas, números, guiones o guión bajo."; return; }
                if (document.querySelector(`[data-tag-check="${val}"]`)) { if (err) err.textContent = "Ese tag ya está en la lista."; return; }
                // Agregar como nuevo chip dentro de la lista de tags (arriba),
                // no debajo del input.
                const chipsRow = $("tagFlowChips");
                const newChip = document.createElement("div");
                newChip.className = "bb-tag-chip";
                newChip.dataset.tag = val;
                newChip.innerHTML = `<input type="checkbox" data-tag-check="${esc(val)}" checked> ${esc(val)}`;
                chipsRow.appendChild(newChip);
                input.value = "";
                if (err) err.textContent = "";
                return;
            }

            if (opt.dataset.action === "apply-tags") {
                const chosen = [...document.querySelectorAll("[data-tag-check]")]
                    .filter(cb => cb.checked)
                    .map(cb => cb.dataset.tagCheck);
                const logs = [];
                slugs.forEach(s => {
                    const r = state.repos.find(x => x.slug === s);
                    if (!r) return;
                    const prev = [...(r.tags || [])];
                    const merged = [...new Set([...prev, ...chosen])];
                    const added = merged.filter(t => !prev.includes(t));
                    const skipped = chosen.filter(t => prev.includes(t));
                    // Escribir en la "BD" (BB.__repo_store → r_details) y reflejarlo
                    // en el estado: así un GET /api/repos-quick posterior lo devuelve.
                    BB.__repo_store.setRepoTags(s, merged);
                    state.repos[state.repos.indexOf(r)].tags = BB.__repo_store.getRepoTags(s);
                    logs.push(`${s}: +${added.length} ${added.join(",") || "(nada nuevo)"} | duplicados omitidos: ${skipped.length}`);
                });
                console.log("[MOCK] upsert tags:", logs);
                closeActionsModal();
                renderRows();
                return;
            }
            if (opt.dataset.action === "back-tags") {
                openActionsModal();
                return;
            }
            if (opt.dataset.action === "clear-tags") {
                slugs.forEach(s => {
                    const r = state.repos.find(x => x.slug === s);
                    if (!r) return;
                    const cleared = (r.tags || []).length;
                    // DELETE real en el almacén: vacía r_details.tags del repo.
                    BB.__repo_store.setRepoTags(s, []);
                    state.repos[state.repos.indexOf(r)].tags = BB.__repo_store.getRepoTags(s);
                    state.flowBySlug[s] && delete state.flowBySlug[s].tags;
                    if (cleared) console.log("[MOCK] clear tags:", `${s}: -${cleared}`);
                });
                renderRows();
                closeActionsModal();
                return;
            }

            if (opt.dataset.action === "mass-pr") {
                for (const slug of slugs) {
                    if (state.states[slug] !== "found") continue;
                    if (state.flowBySlug[slug]?.pr?.url) continue;
                    await createPr(slug);
                }
                closeActionsModal();
            }
            if (opt.dataset.action === "mass-tags-deploy") {
                for (const slug of slugs) {
                    if (state.states[slug] !== "found") continue;
                    for (const env of ["uat", "stgp"]) {
                        const key = slug + "|tag:" + env;
                        if (state.generating.has(key) || state.flowBySlug[slug]?.tags?.[env]) continue;
                        state.generating.add(key);
                        const res = await api("POST", "/api/tags", {
                            repo: slug, origin, destination: dest, prefixes: [env],
                        });
                        if (!state.flowBySlug[slug]) state.flowBySlug[slug] = { slug, pr: null, tags: {} };
                        state.flowBySlug[slug].tags[env] = res.tags[env];
                        state.generating.delete(key);
                    }
                }
                closeActionsModal();
            }
        });

        // ---------- detalle ----------
        async function openDetail(slug) {
            const [flow, ssm, envs] = await Promise.all([
                api("GET", "/api/flow", { origin: "release/REP-325073", destination: "master", with_diff: true, with_tags: true }),
                api("GET", "/api/ssm/values", { repo: slug }),
                api("GET", "/api/ssm/environments"),
            ]);
            const repo = state.repos.find(r => r.slug === slug) || {};
            state.selectedRegions = new Set(envs.environments.map(e => e.code));
            state.regions = envs.environments.map(e => e.code);
            state.flowBySlug[slug] = flow.repos.find(r => r.slug === slug) || { slug, pr: null, tags: {} };
            state.paramsBySlug[slug] = ssm.params;

            state.detailSlug = slug;
            $("searchPanel").style.display = "none";
            $("tablePanel").style.display = "none";
            $("detailPanel").style.display = "flex";
            renderDetail();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function closeDetail() {
            $("detailPanel").style.display = "none";
            $("searchPanel").style.display = "flex";
            $("tablePanel").style.display = "flex";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        $("btnBack").addEventListener("click", closeDetail);

        function renderDetail() {
            const slug = state.detailSlug;
            const d = state.flowBySlug[slug];
            const repo = state.repos.find(r => r.slug === slug) || {};
            const params = state.paramsBySlug[slug] || [];

            $("detailMeta").innerHTML = `
                <div style="font-weight:800;font-size:var(--bb-font-md);">${esc(slug)}</div>
                <div class="muted">${esc(repo.project || "")} · acme-workspace · rama resuelta: <span class="bb-mono">${esc(repo.resolved_branch || "—")}</span>
                    <a class="bb-link" href="https://bitbucket.org/acme-workspace/${esc(slug)}/browse" target="_blank">ver repo ↗</a>
                </div>`;

            const updating = state.generating.has(slug + "|pr");

            // --- PR ---
            let prBlock;
            if (d.pr && d.pr.id) {
                prBlock = `
                    <div class="bb-row-top">
                        <a class="bb-link" href="${esc(d.pr.url)}" target="_blank">PR #${d.pr.id} — ${esc(d.pr.title)}</a>
                    </div>
                    <div class="bb-row-top">
                        <input class="bb-input bb-mono" id="prTitleInput" value="${esc(d.pr.title)}" style="max-width:480px;">
                        <button class="bb-btn-secondary" data-action="update-pr" ${updating ? "disabled" : ""}>
                            ${updating ? '<span class="bb-spinner-inline"></span>Actualizando…' : "Actualizar título"}
                        </button>
                    </div>`;
            } else {
                const origin = $("originBranch").value.trim();
                const dest = $("targetBranch").value.trim() || "master";
                prBlock = `
                    <div class="bb-row-top">
                        <button class="bb-btn-secondary" data-action="create-pr-detail">Crear PR</button>
                        <span class="muted">Sin PR hacia ${esc(dest)} todavía</span>
                        <span class="muted">POST /api/pr?repo=${esc(slug)}&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}</span>
                    </div>`;
            }

            // --- tags deploy ---
            const envs = BB.config.deploy_envs;
            const tagRows = envs.map(env => {
                const tag = d.tags && d.tags[env];
                const gen = state.generating.has(slug + "|tag:" + env);
                let cell;
                if (gen) cell = '<span class="bb-deploy-badge bb-deploy--pending"><span class="bb-spinner-inline"></span>Generando…</span>';
                else if (tag) cell = `<span class="bb-chip-pill bb-mono">${esc(tag)}</span>`;
                else cell = `<button class="bb-btn-secondary bb-btn-sm" data-action="generate-tag" data-env="${env}">Generar ${env}-tag</button>`;
                return `<div class="bb-repos-row"><span>${env}</span><span>${cell}</span></div>`;
            }).join("");

            // --- params SSM + regiones ---
            const cols = state.regions.filter(r => state.selectedRegions.has(r));
            const regionChecks = state.regions
                .map(r => `<label class="bb-chip" style="cursor:pointer;"><input type="checkbox" data-region="${r}" style="margin-right:4px;" ${state.selectedRegions.has(r) ? "checked" : ""}>${r}</label>`)
                .join("");
            const paramsHead = `<span>Parámetro</span><span>Tipo</span>${cols.map(r => `<span class="bb-mono">${r}</span>`).join("")}<span>AWS</span>`;
            const paramsRows = params.map(p => {
                const vals = cols.map(r => {
                    const v = p.values && p.values[r];
                    return v ? `<span class="bb-mono">${esc(v)}</span>` : '<span class="muted">—</span>';
                }).join("");
                const aws = p.aws_status === "missing"
                    ? '<span class="bb-deploy-badge bb-deploy--danger">missing</span>'
                    : '<span class="bb-deploy-badge bb-deploy--ok">ok</span>';
                return `<div class="bb-repos-row"><span class="bb-mono">${esc(p.name)}</span><span>${esc(p.type)}</span>${vals}<span>${aws}</span></div>`;
            }).join("");
            const paramsTable = `
                <div class="bb-row-top">${regionChecks}</div>
                <div class="bb-table bb-table--repos" style="--bb-cols: 2fr 1fr ${cols.map(() => "1.2fr").join(" ")} 0.8fr;">
                    <div class="bb-repos-head">${paramsHead}</div>${paramsRows}
                </div>`;

            const excelBlock = `
                <div class="bb-row-top">
                    <button class="bb-btn-primary" data-action="excel">Generar Excel (consultar todo)</button>
                    <span class="muted">Consulta TODOS los repos del workspace (~${BB.config.total_repos}) — puede tardar varios minutos.</span>
                </div>
                <div id="excelProgress" style="display:none;">
                    <div style="height:8px;background:var(--bb-border);border-radius:4px;overflow:hidden;">
                        <div id="excelBar" style="height:100%;width:0%;background:var(--bb-success);"></div>
                    </div>
                    <span class="muted" id="excelStatus"></span>
                </div>`;

            const section = (title, body) => `
                <div class="bb-section">
                    <div class="bb-section-header">${title}</div>
                    ${body}
                </div>`;

            $("detailBody").innerHTML =
                section("Pull Request", prBlock) +
                section("Tags para CircleCI (deploy)",
                    `<div class="bb-table bb-table--repos" style="--bb-cols: 8rem 1fr;"><div class="bb-repos-head"><span>Ambiente</span><span>Tag</span></div>${tagRows}</div>`) +
                section("Parámetros SSM del repositorio", paramsTable) +
                section("Generar Excel", excelBlock);
        }

        $("detailBody").addEventListener("click", async (ev) => {
            const el = ev.target.closest("[data-action]");
            if (!el) return;
            const action = el.dataset.action;
            const slug = state.detailSlug;

            if (action === "create-pr-detail") {
                openPrModal(slug);
            }

            if (action === "update-pr") {
                const title = ($("prTitleInput") && $("prTitleInput").value.trim());
                if (!title) return;
                state.generating.add(slug + "|pr");
                renderDetail();
                const res = await api("POST", "/api/prs/update-titles", {
                    repos: [slug], origin: "release/REP-325073", destination: "master", title,
                });
                const row = res.repos[0];
                if (row) state.flowBySlug[slug].pr = { id: row.id, title: row.title, url: row.url };
                state.generating.delete(slug + "|pr");
                renderDetail();
            }

            if (action === "generate-tag") {
                const env = el.dataset.env;
                const key = slug + "|tag:" + env;
                if (state.generating.has(key)) return;
                state.generating.add(key);
                renderDetail();
                const res = await api("POST", "/api/tags", {
                    repo: slug, origin: "release/REP-325073", destination: "master", prefixes: [env],
                });
                state.flowBySlug[slug].tags[env] = res.tags[env];
                state.generating.delete(key);
                renderDetail();
            }

            if (action === "excel") {
                const btn = ev.target.closest("[data-action='excel']");
                if (btn.disabled) return;
                btn.disabled = true;
                $("excelProgress").style.display = "block";
                let pct = 0;
                clearInterval(state.excelTimer);
                state.excelTimer = setInterval(() => {
                    pct = Math.min(100, pct + 3);
                    $("excelBar").style.width = pct + "%";
                    $("excelStatus").textContent =
                        pct >= 100 ? "Excel listo: ssm-params-workspace-2026-09-15.xlsx" : `Consulta completa del workspace… ${pct}%`;
                    if (pct >= 100) clearInterval(state.excelTimer);
                }, 250);
            }
        });

        $("detailBody").addEventListener("change", (ev) => {
            const cb = ev.target.closest("[data-region]");
            if (!cb) return;
            if (cb.checked) state.selectedRegions.add(cb.dataset.region);
            else state.selectedRegions.delete(cb.dataset.region);
            renderDetail();
        });

        // ---------- init ----------
        $("wsTotal").textContent = BB.config.total_repos;

        // Chips editables de prefijos y blacklist.
        function renderFilterChips(containerId, items, kind) {
            const danger = kind === "blacklist" ? " bb-chip-pill--danger" : "";
            $(containerId).innerHTML =
                items.map((p, i) => `
                    <span class="bb-chip-pill${danger} bb-mono">
                        ${esc(p)}
                        <button class="bb-chip-x" data-remove-chip="${kind}" data-index="${i}" title="Quitar">✕</button>
                    </span>`).join("") +
                `<button class="bb-chip-add" data-add-chip="${kind}">＋ Agregar</button>`;
        }

        renderFilterChips("prefixChips", state.prefixes, "prefix");
        renderFilterChips("blacklistChips", state.blacklist, "blacklist");

        $("prefixChips").addEventListener("click", onChipsClick("prefix"));
        $("blacklistChips").addEventListener("click", onChipsClick("blacklist"));
        console.log("[MOCK] init OK — prefixes:", state.prefixes, "blacklist:", state.blacklist);

        function onChipsClick(kind) {
            return (ev) => {
                const remove = ev.target.closest("[data-remove-chip]");
                if (remove) {
                    const arr = kind === "prefix" ? state.prefixes : state.blacklist;
                    arr.splice(Number(remove.dataset.index), 1);
                    renderFilterChips(kind === "prefix" ? "prefixChips" : "blacklistChips", arr, kind);
                    return;
                }
                const add = ev.target.closest("[data-add-chip]");
                if (!add) return;
                const val = window.prompt(kind === "prefix"
                    ? "Nuevo prefijo de proyecto (ej: bbit-orders-):"
                    : "Slug a excluir (ej: bbit-trnxd-backend-qa):");
                const v = (val || "").trim();
                if (!v) return;
                const arr = kind === "prefix" ? state.prefixes : state.blacklist;
                if (arr.includes(v)) { window.alert("Ya existe en la lista."); return; }
                arr.push(v);
                renderFilterChips(kind === "prefix" ? "prefixChips" : "blacklistChips", arr, kind);
            };
        }
    </script>
</body>

</html>
