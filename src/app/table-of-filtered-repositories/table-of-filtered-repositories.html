<div class="bb-panel" id="tablePanel" style="display:none;">
    <div class="bb-section-header">Repositorios filtrados</div>
    <!-- barra de filtros de la tabla: texto (slug/nombre) + chips de tags -->
    <div class="bb-filter-bar">
        <div class="bb-field" style="max-width:320px;flex:none;">
            <label for="tableSearch">Buscar en la lista</label>
            <input class="bb-input" id="tableSearch" placeholder="slug o nombre…" style="font-size:var(--bb-font-sm);">
        </div>
        <div class="bb-field">
            <label>Tags de flujo</label>
            <div class="bb-chips" id="tagFilterChips"></div>
        </div>
    </div>

    <div class="bb-row-top" style="align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
        <label
            style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--bb-font-sm);font-weight:600;padding-bottom:6px;">
            <input type="checkbox" id="toggleBranch"
                style="width:15px;height:15px;accent-color:var(--bb-blue);cursor:pointer;">
            Procesar salida
        </label>
        <input class="bb-input " id="originBranch" placeholder="Rama origen" value="release/REP-325073"
            style="display:none;max-width:200px;">
        <input class="bb-input " id="targetBranch" placeholder="Rama Destino" value="master"
            style="display:none;max-width:200px;">
        <div class="summary" id="branchSummary" style="display:none;">
            <b id="statTotal">–</b> repos · <b style="color:var(--bb-success);" id="statFound">–</b> con la rama
            · <b style="color:var(--bb-danger);" id="statMissing">–</b> sin la rama
        </div>
        <button class="bb-btn-secondary" id="btnBranch" style="display:none;">Ver rama en estos repos</button>
    </div>

    <!-- barra contextual: visible con 1+ seleccionados -->
    <div class="bb-selection-bar" id="selectionBar" style="display:none;">
        <input type="checkbox" id="checkAll" style="width:15px;height:15px;accent-color:#fff;cursor:pointer;"
            title="Seleccionar/deseleccionar todo lo filtrado">
        <b id="selCount">0</b> seleccionados
        <span class="bb-selection-spacer"></span>
        <button class="bb-btn-secondary" id="btnClear" style="padding:0 10px;">Limpiar</button>
        <button class="bb-btn-primary" id="btnActions"
            style="background:#fff;color:var(--bb-blue);border:none;">Acciones ▾</button>
    </div>

    <div class="bb-table bb-table--repos" id="reposTable" style="--bb-cols: 2.2rem 2rem 1.3fr 1.6fr 1.2fr;">
        <div class="bb-repos-head" id="reposHead">
            <span class="bb-check-cell"><input type="checkbox" id="checkAllHead" title="Seleccionar página"></span>
            <span>#</span>
            <span>Repositorio</span>
            <span id="prHeadCol">Pull Request</span>
            <span>Procesamiento</span>
        </div>
        <div id="rows"></div>
    </div>

    <div class="table-foot"
        style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <span id="pagInfo">Mostrando 0 repositorios</span>
        <span style="display:flex;align-items:center;gap:8px;">
            <label style="font-weight:700;color:var(--bb-text-secondary);" for="pageSize">Filas:</label>
            <select id="pageSize" class="bb-mono" style="height:26px;">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span id="pageLabel" class="bb-mono" style="min-width:52px;text-align:center;">1 / 1</span>
            <button class="bb-btn-secondary bb-btn-sm" id="prevPage">‹ Anterior</button>
            <button class="bb-btn-secondary bb-btn-sm" id="nextPage">Siguiente ›</button>
        </span>
    </div>
</div>
