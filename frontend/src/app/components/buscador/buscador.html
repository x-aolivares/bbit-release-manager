<div class="bb-panel">
  <div class="bb-section">
    <div class="bb-section-header">Buscador de repositorios</div>
    <div class="bb-row-top">
      <div class="bb-field">
        <label>Prefijos de proyecto</label>
        <div class="bb-chips">
          @for (p of projectPrefixes(); track p; let i = $index) {
          <span class="bb-chip-pill bb-mono">{{ p }}
            <button class="bb-chip-x" (click)="removeProjectPrefix.emit(i)">×</button>
          </span>
          }
          @if (!addingProjectPrefix()) {
          <button class="bb-chip-add" (click)="addingProjectPrefix.set(true)">+ Agregar prefijo</button>
          } @else {
          <input class="bb-chip-input" [ngModel]="projectPrefixInput"
                 (ngModelChange)="projectPrefixInputChange.emit($event)"
                 placeholder="ej: bbit-orders-"
                 (keyup.enter)="addProjectPrefix.emit()"/>
          <button class="bb-chip-add" (click)="addProjectPrefix.emit()">OK</button>
          <button class="bb-chip-add" (click)="addingProjectPrefix.set(false)">×</button>
          }
        </div>
      </div>
      <div class="bb-field">
        <label>Blacklist (excluir)</label>
        <div class="bb-chips">
          @for (p of blacklisted(); track p; let i = $index) {
          <span class="bb-chip-pill bb-chip-pill--danger bb-mono">{{ p }}
            <button class="bb-chip-x" (click)="removeBlacklist.emit(i)">×</button>
          </span>
          }
          @if (!addingBlacklist()) {
          <button class="bb-chip-add" (click)="addingBlacklist.set(true)">+ Excluir proyecto</button>
          } @else {
          <input class="bb-chip-input" [ngModel]="blacklistInput"
                 (ngModelChange)="blacklistInputChange.emit($event)"
                 placeholder="slug-a-excluir"
                 (keyup.enter)="addBlacklist.emit()"/>
          <button class="bb-chip-add" (click)="addBlacklist.emit()">OK</button>
          <button class="bb-chip-add" (click)="addingBlacklist.set(false)">×</button>
          }
        </div>
      </div>
      <button class="bb-btn-primary" (click)="buscarRepos.emit()" [disabled]="reposLoading()">
        @if (reposLoading()) {
        <span class="bb-spinner-inline"></span>
        }
        Buscar Repositorios
      </button>
    </div>
  </div>
</div>
