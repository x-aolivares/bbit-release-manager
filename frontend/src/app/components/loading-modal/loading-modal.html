@if (open()) {
<div class="bb-modal-mask">
  <div class="bb-modal bb-modal--loading" (click)="$event.stopPropagation()">
    <ion-spinner name="dots" class="bb-spinner bb-spinner--lg"></ion-spinner>
    <div class="bb-loading-text">{{ finalizing() ? 'Finalizando consultas…' : 'Procesando…' }}</div>
  </div>
</div>
}
