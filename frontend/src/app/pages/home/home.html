<app-topbar
  [connected]="connected()"
  [identity]="identity()"
  [repoCount]="repoCount()"
  [health]="health()"
  [clientAlias]="clientAlias()"
  (openHistory)="sidebarOpen.set(true)"
  (requestConfig)="openConfig()"
  (requestDisconnect)="askDisconnect.set(true)">
</app-topbar>

<ion-content>
  <div class="bb-page-wrapper">
    <!-- Mobile sidebar mask -->
    <div class="bb-sidebar-mask" [class.bb-sidebar-mask--visible]="sidebarOpen()" (click)="sidebarOpen.set(false)"></div>

    <!-- Sidebar (solo con sesión activa: el historial no debe verse en el login) -->
    @if (connected()) {
    <app-session-sidebar
      class="bb-sidebar-host"
      [class.bb-sidebar--open]="sidebarOpen()"
      [sessions]="sessions()"
      [currentSessionId]="currentSessionId()"
      (sessionSelected)="onSessionSelected($event)"
      (sessionDeleted)="onSessionDeleted($event)"
      (historyCleared)="onHistoryCleared()">
    </app-session-sidebar>
    }

    <div class="bb-page" [class.bb-page--full]="!connected()">
      @if (error()) {
      <ion-card class="bb-card">
        <ion-card-content class="bb-error">{{ error() }}</ion-card-content>
      </ion-card>
      }

    @if (!connected()) {
    <app-auth-panel
      [loading]="loading()"
      [storedCreds]="storedCreds()"
      (connectRequested)="onConnectRequested($event)"
      (reuseRequested)="reuseSession()"
      (useOtherToken)="storedCreds.set(false)">
    </app-auth-panel>
    }

    @if (connected()) {
    <app-query-panel
      [(origin)]="origin"
      [(destination)]="destination"
      [forceCache]="forceCache"
      [prefixes]="prefixes"
      [addingPrefix]="addingPrefix"
      [(prefixInput)]="prefixInput"
      [blacklisted]="blacklisted"
      [addingBlacklist]="addingBlacklist"
      [(blacklistInput)]="blacklistInput"
      [projectPrefixes]="projectPrefixes"
      [addingProjectPrefix]="addingProjectPrefix"
      [(projectPrefixInput)]="projectPrefixInput"
      [reposLoading]="reposLoading"
      (loadRepos)="loadRepos()"
      (addPrefix)="addPrefix()"
      (removePrefix)="removePrefix($event)"
      (addBlacklist)="addBlacklist()"
      (removeBlacklist)="removeBlacklist($event)"
      (addProjectPrefix)="addProjectPrefix()"
      (removeProjectPrefix)="removeProjectPrefix($event)">
    </app-query-panel>

    @if (tableLoaded()) {
    <app-repos-table
      [repos]="sortedRepos()"
      [loadedPrefixes]="loadedPrefixes()"
      [prefixCols]="prefixCols()"
      [destination]="destination"
      [origin]="origin"
      [ciConfigured]="ciConfigured()"
      [ciError]="ciError()"
      [creatingPr]="creatingPr()"
      [tagging]="tagging()"
      [taggingRepo]="taggingRepo()"
      [reposLoading]="reposLoading()"
      [syncingPrs]="syncingPrs()"
      [failedRepos]="failedRepos()"
      [sortKey]="repoSortKey()"
      [sortEnv]="repoSortEnv()"
      [sortDir]="repoSortDir()"
      [(prTitle)]="prTitle"
      (sortEvent)="onSortRepo($event)"
      (createPr)="createPr($event)"
      (generateTag)="onGenerateTag($event)"
      (generateTagsAll)="generateTags()"
      (syncPrs)="syncPrs($event)"
      (reportRequested)="openReport()"
      (refresh)="loadRepos()"
      (retryFailed)="retryFailed()">
    </app-repos-table>
    }

    <app-params-panel
      [connected]="connected()"
      [paramsLoaded]="paramsLoaded()"
      [origin]="origin"
      [destination]="destination"
      [hasRepos]="repos().length > 0"
      [scanMode]="scanMode"
      [paramsLoading]="paramsLoading"
      [params]="params()"
      [removed]="removed()"
      [rows]="paramRows()"
      [estadoOptions]="estadoOptions"
      [estadoFilter]="estadoFilter"
      (loadParams)="loadParams()"
      (openParams)="openParams()"
      (toggleEstado)="toggleEstado($event)"
      (openSsmView)="openSsmView($event)">
    </app-params-panel>
    }

    <app-report-modal
      [open]="reportOpen()"
      [initialMode]="reportInitialMode"
      [origin]="origin"
      [prefixes]="prefixes()"
      [repos]="repos()"
      [rows]="paramRows()"
      (close)="reportOpen.set(false)">
    </app-report-modal>

    <app-confirm-modal
      [open]="askDisconnect()"
      (confirmDelete)="disconnect(true)"
      (confirmKeep)="disconnect(false)"
      (cancel)="askDisconnect.set(false)">
    </app-confirm-modal>

    <app-config-modal
      [open]="configOpen()"
      [(clientAlias)]="clientAlias"
      [(gitClonesDir)]="gitClonesDir"
      [(gitClonesEnabled)]="gitClonesEnabled"
      (close)="configOpen.set(false)"
      (bitbucketReauth)="onBitbucketReauth()">
    </app-config-modal>

    <app-loading-modal
      [open]="spinnerVisible()"
      [finalizing]="finalizing()">
    </app-loading-modal>

  </div>
</div>
</ion-content>
