<app-topbar
  [connected]="connected()"
  [identity]="identity()"
  [repoCount]="repoCount()"
  [health]="health()"
  [clientAlias]="clientAlias()"
  (openHistory)="sidebarOpen.set(true)"
  (requestConfig)="openConfig()"
  (requestDisconnect)="askDisconnect.set(true)">
</app-topbar>

<ion-content>
  <div class="bb-page-wrapper">
    <!-- Mobile sidebar mask -->
    <div class="bb-sidebar-mask" [class.bb-sidebar-mask--visible]="sidebarOpen()" (click)="sidebarOpen.set(false)"></div>

    <!-- Sidebar -->
    @if (connected()) {
    <app-session-sidebar
      class="bb-sidebar-host"
      [class.bb-sidebar--open]="sidebarOpen()"
      [sessions]="sessions()"
      [currentSessionId]="currentSessionId()"
      (sessionSelected)="onSessionSelected($event)"
      (sessionDeleted)="onSessionDeleted($event)"
      (historyCleared)="onHistoryCleared()">
    </app-session-sidebar>
    }

    <div class="bb-page" [class.bb-page--full]="!connected()">
      @if (error()) {
      <ion-card class="bb-card">
        <ion-card-content class="bb-error">{{ error() }}</ion-card-content>
      </ion-card>
      }

      @if (!connected()) {
      <app-auth-panel
        [loading]="loading()"
        [storedCreds]="storedCreds()"
        (connectRequested)="onConnectRequested($event)"
        (reuseRequested)="reuseSession()"
        (useOtherToken)="storedCreds.set(false)">
      </app-auth-panel>
      }

      @if (connected()) {
      <app-buscador
        [projectPrefixes]="projectPrefixes"
        [addingProjectPrefix]="addingProjectPrefix"
        [projectPrefixInput]="projectPrefixInput"
        (projectPrefixInputChange)="projectPrefixInput = $event"
        [blacklisted]="blacklisted"
        [addingBlacklist]="addingBlacklist"
        [blacklistInput]="blacklistInput"
        (blacklistInputChange)="blacklistInput = $event"
        [reposLoading]="reposLoading"
        (buscarRepos)="loadRepos()"
        (addProjectPrefix)="addProjectPrefix()"
        (removeProjectPrefix)="removeProjectPrefix($event)"
        (addBlacklist)="addBlacklist()"
        (removeBlacklist)="removeBlacklist($event)">
      </app-buscador>

      @if (tableLoaded() && !detalleOpen()) {
      <app-repos-buscados
        [repos]="reposRows()"
        [states]="reposStates()"
        [origin]="origin"
        [destination]="destination"
        [creating]="prCreatingBySlug()"
        [removed]="reposRemovedCount()"
        (toggleBranch)="onToggleBranch($event)"
        (originChange)="onOriginChange($event)"
        (destinationChange)="onDestinationChange($event)"
        (verRama)="onVerRama()"
        (crearPr)="onCrearPr($event)"
        (abrirDetalle)="onAbrirDetalle($event)"
        (seleccion)="onSeleccion($event)"
        (acciones)="onAcciones($event)">
      </app-repos-buscados>
      }

      @if (detalleOpen() && detalleRepo()) {
      <app-repo-detalle
        [repo]="detalleRepo()!"
        [origin]="origin"
        [destination]="destination"
        [deployEnv]="prefixes()"
        [regions]="detalleRegions()"
        [updating]="prUpdating()"
        [generating]="detalleGenerating()"
        (back)="onDetalleBack()"
        (crearPr)="onCrearPr(detalleRepo()!.slug)"
        (actualizarPr)="onActualizarPr($event)"
        (generateTag)="onDetalleTag($event)">
      </app-repo-detalle>
      }

      }
    </div>

    <app-acciones-masivas
      [open]="accionesOpen()"
      [selected]="accionesSelected()"
      [totalSelected]="accionesSelected().length"
      [readyPr]="accionesReadyPr()"
      [processing]="massWorking()"
      (massPr)="onMassPr()"
      (massTagsDeploy)="onMassTagsDeploy($event)"
      (flowTags)="onFlowTags($event)"
      (close)="accionesOpen.set(false)">
    </app-acciones-masivas>

    <app-crear-pr
      [open]="crearPrOpen()"
      [slug]="crearPrSlug()"
      [origin]="origin"
      [destination]="destination"
      (confirm)="onCrearPrConfirm($event)"
      (close)="crearPrOpen.set(false)">
    </app-crear-pr>

    <app-confirm-modal
      [open]="askDisconnect()"
      (confirmDelete)="disconnect(true)"
      (confirmKeep)="disconnect(false)"
      (cancel)="askDisconnect.set(false)">
    </app-confirm-modal>

    <app-config-modal
      [open]="configOpen()"
      [(clientAlias)]="clientAlias"
      [(gitClonesDir)]="gitClonesDir"
      [(gitClonesEnabled)]="gitClonesEnabled"
      (close)="configOpen.set(false)"
      (bitbucketReauth)="onBitbucketReauth()">
    </app-config-modal>

    <app-loading-modal
      [open]="spinnerVisible()"
      [finalizing]="finalizing()">
    </app-loading-modal>

  </div>
</ion-content>
