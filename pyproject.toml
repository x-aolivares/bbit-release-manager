[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbit-release-manager"
version = "0.1.0"
description = "Release Manager - monolito: API para procesar la informacion de los repositorios"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["docs/requirements.txt"]}
optional-dependencies = {dev = {file = ["docs/requirements-dev.txt"]}}

[project.scripts]
bbit-web = "backend.handler:run"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]