[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbit-release-manager"
version = "0.38.1"
description = "BBit Release Manager - CLI y web para revisar ramas y parametros SSM contra Bitbucket"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["docs/requirements.txt"]}
optional-dependencies = {dev = {file = ["docs/requirements-dev.txt"]}}

[project.scripts]
bbit = "bbit_release.cli:app"

[tool.setuptools.packages.find]
include = ["bbit_release*"]

[tool.pytest.ini_options]
testpaths = ["tests"]